[package]
name = "focus-time"
version = "1.15.0"
description = "Native macOS menu bar focus time"
authors = ["rbika"]
edition = "2021"

[lib]
name = "focus_time_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSAnimation",
    "NSAnimationContext",
    "NSApplication",
    "NSFont",
    "NSFontDescriptor",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSSound",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15.7"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
